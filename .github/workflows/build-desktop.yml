name: Build (Desktop)

on:
  push:
    # Don't run for tags
    tags-ignore:
      - 'v*.*.*'
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Branches of this repository are already built by the push trigger,
    # so only build pull requests opened from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update packages
        run: sudo apt-get -yq update

      - name: Install Dependencies
        run: sudo apt-get -y -qq install libsdl2-dev libsdl2-image-dev libopus-dev libcurl4-openssl-dev uuid-dev
          libavcodec-dev libavutil-dev libexpat1-dev libmbedtls-dev libfontconfig1-dev gettext xvfb

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DTARGET_DESKTOP=ON

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: xvfb-run ctest -C "$BUILD_TYPE" --output-on-failure

      - name: Verify Debug test build keeps assertions enabled
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          if grep -E '^CMAKE_(C|CXX)_FLAGS(_DEBUG)?:STRING=.*-DNDEBUG' CMakeCache.txt; then
            echo "Debug test build unexpectedly defines -DNDEBUG" >&2
            exit 1
          fi

      - name: Configure and test with ASan + UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-sanitize" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DTARGET_DESKTOP=ON -DWITH_SANITIZE=address,undefined
          cmake --build "$GITHUB_WORKSPACE/build-sanitize" --config "$BUILD_TYPE"
          xvfb-run ctest --test-dir "$GITHUB_WORKSPACE/build-sanitize" -C "$BUILD_TYPE" --output-on-failure

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts for shell errors
        run: shellcheck -S error scripts/*/*.sh
